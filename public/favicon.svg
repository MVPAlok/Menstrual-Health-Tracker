<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#ff7b9c" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#a53556" stop-opacity="0" />
    </radialGradient>
    
    <!-- Primary Brand Gradient -->
    <linearGradient id="brandGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#a53556" />
      <stop offset="40%" stop-color="#ff7b9c" />
      <stop offset="100%" stop-color="#ae9fc4" />
    </linearGradient>

    <!-- Shadow Filter for depth -->
    <filter id="premiumShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#a53556" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" />

  <!-- Logo Group with Drop Shadow -->
  <g filter="url(#premiumShadow)">
    <!-- Cycle Ring (representing lunar / cycle phases) -->
    <circle cx="256" cy="256" r="190" fill="none" stroke="url(#brandGrad)" stroke-width="8" stroke-dasharray="12 6" opacity="0.3" />
    <circle cx="256" cy="256" r="170" fill="none" stroke="url(#brandGrad)" stroke-width="2" opacity="0.15" />

    <!-- Central Emblem: The Lotus-Heart & Biological Wave -->
    <path d="M 230,120 C 170,140 100,200 100,280 C 100,350 150,390 200,390 C 240,390 256,360 256,330 C 256,360 272,390 312,390 C 362,390 412,350 412,280 C 412,200 342,140 282,120 C 268,115 244,115 230,120 Z" fill="none" stroke="url(#brandGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Inner Core: The Pulsing Cycle/Droplet Core -->
    <path d="M 256,170 C 275,215 315,260 315,300 C 315,332 288,358 256,358 C 224,358 197,332 197,300 C 197,260 237,215 256,170 Z" fill="url(#brandGrad)" />
          
    <!-- Dynamic Rhythm Wave (sine-wave-like curve representing hormone fluctuations) -->
    <path d="M 120,290 C 170,250 200,330 256,290 C 312,250 342,330 392,290" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.85" />
          
    <!-- Small accent pulsing dot representing peak ovulation / fertility -->
    <circle cx="256" cy="225" r="14" fill="#ffffff" filter="drop-shadow(0 0 6px #ff7b9c)" />
  </g>
</svg>